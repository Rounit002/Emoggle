version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /signaling-server
    schedule:
      interval: weekly
    groups:
      signaling-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /ai-judge
    schedule:
      interval: weekly
